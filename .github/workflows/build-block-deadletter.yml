name: Build BlockDeadLetter.dylib

on:
  push:
    branches: [main, master]
    paths:
      - "deadletter_block/**"
      - ".github/workflows/build-block-deadletter.yml"
  pull_request:
    paths:
      - "deadletter_block/**"
      - ".github/workflows/build-block-deadletter.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile iOS arm64 dylib
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Build dylib
        working-directory: deadletter_block
        run: |
          chmod +x build.sh
          ./build.sh
          file BlockDeadLetter.dylib
          ls -lh BlockDeadLetter.dylib

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlockDeadLetter-dylib
          path: deadletter_block/BlockDeadLetter.dylib
          if-no-files-found: error
          retention-days: 30
